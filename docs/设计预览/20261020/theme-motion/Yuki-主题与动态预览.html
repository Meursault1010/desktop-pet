<!doctype html>
<html lang="zh-CN" data-theme="snow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yuki · 主题与动态预览</title>
<style>
:root{color-scheme:light;--bg:#e6ecf1;--paper:#fcfdfe;--ink:#243c50;--sub:#53697a;--line:#c3d4df;--accent:#276e94;--selected:#173d57;--selected-ink:#fff;--star:#7b9bb3}
[data-theme=mist]{--bg:#ced8e1;--paper:#e8eef3;--ink:#263d50;--sub:#4c6477;--line:#b8cbda;--accent:#245f86;--selected:#234861;--star:#6f8da5}
[data-theme=night]{color-scheme:dark;--bg:#0a111b;--paper:#121c29;--ink:#e1eaf3;--sub:#a6b8c9;--line:#34485d;--accent:#a7cce8;--selected:#c4ddef;--selected-ink:#10283c;--star:#b3d2ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;transition:background-color 320ms,color 320ms}button{font:inherit;cursor:pointer;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 15px;transition:background-color 140ms,border-color 140ms,transform 120ms}button:hover{border-color:var(--accent);background:var(--bg)}button:active{transform:translateY(1px)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button[aria-pressed=true]{background:var(--selected);color:var(--selected-ink);border-color:var(--selected)}
header{max-width:1168px;margin:auto;padding:26px 24px 18px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:17px;letter-spacing:.03em;margin:0;font-weight:600}header p{margin:2px 0 0;font-size:12px;color:var(--sub)}.themes{display:flex;gap:7px;margin-left:auto}.controls{max-width:1120px;margin:0 auto 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 10px}.controls button{font-size:12px;padding:6px 11px}.controls span{font-size:12px;color:var(--sub);margin-left:auto}main{padding:0 20px}.preview{position:relative;max-width:1120px;margin:auto;aspect-ratio:1120/800;overflow:hidden}.preview img{display:block;width:100%;height:100%;position:absolute;inset:0;opacity:0;transition:opacity 320ms ease;pointer-events:none}.preview img.active{opacity:1}.stars{position:absolute;left:33%;top:8%;width:36%;height:9%;pointer-events:none}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--star);opacity:.3;animation:drift 24s ease-in-out infinite,glimmer 14s ease-in-out infinite}.star:nth-child(2n){width:1px;height:1px;animation-delay:-7s,-3s}.star:nth-child(3n){animation-delay:-16s,-8s}.star:nth-child(4n){animation-delay:-11s,-5s}@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-2px)}}@keyframes glimmer{0%,100%{opacity:.18}50%{opacity:.45}}
.feedback{max-width:1100px;margin:18px auto 0;border-top:1px solid var(--line);padding:20px 0;display:flex;align-items:center;gap:22px;flex-wrap:wrap}.feedback h2{font-size:14px;margin:0}.feedback p{font-size:12px;color:var(--sub);margin:4px 0 0}.segmented{display:flex;gap:3px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:7px}.segmented button{border:0;padding:7px 18px;font-size:13px}.health{display:flex;align-items:center;gap:12px;margin-left:auto}.health button{padding:0;border:0;width:36px;height:22px;border-radius:15px;background:var(--line);position:relative}.health button[aria-checked=true]{background:var(--accent)}.health button:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform 180ms ease}.health button[aria-checked=true]:after{transform:translateX(14px)}.health button:active{transform:none}.note{max-width:1100px;margin:0 auto;padding:0 0 28px;font-size:12px;color:var(--sub)}.reduced *,.reduced *:before,.reduced *:after{animation:none!important;transition:none!important}.paused .star{animation-play-state:paused}.reduced .stars{display:none}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.stars{display:none}}@media(max-width:700px){header{padding:18px 14px}.themes{margin-left:0}.controls{padding:0 14px}.controls span{margin-left:0;width:100%}main{padding:0 7px}.feedback,.note{margin-left:14px;margin-right:14px}.health{margin-left:0}.segmented button{padding:7px 12px}}
</style>
<header><div><h1>Yuki · 主题与动态</h1><p>安静的光，缓慢的星点，清楚的操作反馈。</p></div><nav class="themes" aria-label="选择主题"><button data-set-theme="snow" aria-pressed="true">雪白</button><button data-set-theme="mist" aria-pressed="false">银雾</button><button data-set-theme="night" aria-pressed="false">星夜</button></nav></header>
<div class="controls"><button id="ambient" aria-pressed="false">暂停星点</button><button id="reduce" aria-pressed="false">减少动态</button><span id="description" role="status">雪白 · 清晰、明亮，适合白天阅读</span></div>
<main><div class="preview" role="img" aria-label="Yuki 工作台雪白主题，视觉设计示意" id="preview"><img class="active" data-image="snow" src="Yuki-雪白-小窗口.png" alt=""><img data-image="mist" src="Yuki-银雾-小窗口.png" alt=""><img data-image="night" src="Yuki-星夜-小窗口.png" alt=""><div class="stars" aria-hidden="true"><i class="star" style="left:3%;top:20%"></i><i class="star" style="left:16%;top:65%"></i><i class="star" style="left:31%;top:12%"></i><i class="star" style="left:46%;top:48%"></i><i class="star" style="left:64%;top:24%"></i><i class="star" style="left:78%;top:75%"></i><i class="star" style="left:93%;top:42%"></i></div></div>
<section class="feedback" aria-labelledby="feedback-title"><div><h2 id="feedback-title">试一下控件手感</h2><p>以下为可操作的动效样例。</p></div><div class="segmented" role="group" aria-label="陪伴节奏样例"><button aria-pressed="false">日常</button><button aria-pressed="true">安静</button><button aria-pressed="false">专注</button></div><div class="health"><span id="health-label">健康提醒</span><button role="switch" aria-checked="true" aria-labelledby="health-label"></button></div></section>
<p class="note">设计预览：主题、星点与下方样例控件可交互；工作台图中的业务控件和数据为示意，不连接正式程序。专注样例会暂停星点。系统开启“减少动态”时自动停用环境动画。</p></main>
<script>
const labels={snow:['雪白','清晰、明亮，适合白天阅读'],mist:['银雾','柔和的银蓝层次，适合作为日常默认'],night:['星夜','低亮度深灰蓝，适合夜间陪伴']};let paused=false,focus=false;const $=s=>document.querySelector(s);
function setTheme(theme){document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-set-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.setTheme===theme)));document.querySelectorAll('[data-image]').forEach(i=>i.classList.toggle('active',i.dataset.image===theme));$('#description').textContent=labels[theme].join(' · ');$('#preview').setAttribute('aria-label','Yuki 工作台'+labels[theme][0]+'主题，视觉设计示意')}
function setPaused(){document.body.classList.toggle('paused',paused||focus);$('#ambient').setAttribute('aria-pressed',String(paused));$('#ambient').textContent=paused?'播放星点':'暂停星点'}
document.querySelectorAll('[data-set-theme]').forEach(b=>b.onclick=()=>setTheme(b.dataset.setTheme));$('#ambient').onclick=()=>{paused=!paused;setPaused()};$('#reduce').onclick=()=>{const r=document.body.classList.toggle('reduced');$('#reduce').setAttribute('aria-pressed',String(r));$('#reduce').textContent=r?'恢复动态':'减少动态'};document.querySelectorAll('.segmented button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.segmented button').forEach(i=>i.setAttribute('aria-pressed',String(i===b)));focus=b.textContent==='专注';setPaused()});$('.health button').onclick=e=>{const b=e.currentTarget;b.setAttribute('aria-checked',String(b.getAttribute('aria-checked')!=='true'))};Promise.all(Array.from(document.images).map(i=>i.decode().catch(()=>{})));
</script></html>
